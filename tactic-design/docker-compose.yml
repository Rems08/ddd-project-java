services:
  app:
    container_name: xyzhotel-backend
    build: .
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/xyzhotel
      - SPRING_DATASOURCE_USERNAME=xyzhotel
      - SPRING_DATASOURCE_PASSWORD=xyzhotel123
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
  postgres:
    image: postgres:16-alpine
    container_name: xyzhotel-postgres
    environment:
      POSTGRES_DB: xyzhotel
      POSTGRES_USER: xyzhotel
      POSTGRES_PASSWORD: xyzhotel123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
